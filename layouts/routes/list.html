{{ define "main" }}

<main class="routes-page">
  <header class="routes-header">
    <h1>{{ .Title }}</h1>

    {{ with .Content }}
    <div class="routes-intro">{{ . }}</div>
    {{ end }}
  </header>

  <section class="routes-grid">
    {{ range .Pages.ByTitle }} {{ partial "route-card.html" . }} {{ end }}
  </section>
</main>

{{ end }}
