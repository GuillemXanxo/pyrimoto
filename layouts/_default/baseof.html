<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <title>
      {{ if .Title }} {{ .Title }} · {{ site.Title }} {{ else }} {{ site.Title
      }} {{ end }}
    </title>

    <meta name="description" content="{{ site.Params.description }}" />

    {{ block "head" . }}{{ end }}
  </head>

  <body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    {{ partial "header.html" . }}

    <main>{{ block "main" . }}{{ end }}</main>

    {{ partial "footer.html" . }}
  </body>
  {{ $headerJS := resources.Get "js/header.js" | minify | fingerprint }}
  <script
    src="{{ $headerJS.RelPermalink }}"
    integrity="{{ $headerJS.Data.Integrity }}"
    defer
  ></script>
  {{ $routeMapJS := resources.Get "js/route-map.js" | minify | fingerprint }}
  <script
    src="{{ $routeMapJS.RelPermalink }}"
    integrity="{{ $routeMapJS.Data.Integrity }}"
    defer
  ></script>
</html>
