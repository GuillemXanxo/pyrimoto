{{/* SEO metadata */}} {{ $pageTitle := .Params.title | default .Title | default
.Site.Title }} {{ $description := .Description | default
.Site.Params.description }}

<meta
  property="og:type"
  content="{{ if .IsHome }}website{{ else }}website{{ end }}"
/>

<meta property="og:title" content="{{ $pageTitle }}" />

<meta property="og:description" content="{{ $description }}" />

<meta property="og:url" content="{{ .Permalink }}" />

<meta property="og:site_name" content="{{ .Site.Title }}" />

<meta property="og:locale" content="{{ .Language.Locale }}" />

{{ with .Site.Params.images }} {{ range first 1 . }}
<meta property="og:image" content="{{ (absURL .) }}" />
{{ end }} {{ end }}
