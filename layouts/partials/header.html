<header class="site-header{{ if .IsHome }} site-header-home{{ end }}">

    <div class="site-header-inner">

        <a
            class="site-logo"
            href="{{ "/" | relLangURL }}"
            aria-label="Pyrimoto"
        >
            Pyrimoto
        </a>

        <nav class="site-nav" aria-label="{{ i18n "main_navigation" }}">

            <a href="{{ "/routes/" | relLangURL }}">
                {{ i18n "routes" }}
            </a>

            <a href="{{ "/about/" | relLangURL }}">
                {{ i18n "about" }}
            </a>

            <a href="{{ "/contact/" | relLangURL }}">
    {{ i18n "contact" }}
</a>


        </nav>

        <div class="site-language">
            {{ partial "language-switcher.html" . }}
        </div>

    </div>

</header>
